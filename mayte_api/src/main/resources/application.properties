# ==========================================================
# Configuracion del servidor
# ==========================================================
server.port=${PORT:8081}

# ==========================================================
# Base de datos H2 (relacional, embebida en memoria)
# Cumple el requisito "H2/PostgreSQL segun el stack elegido"
# ==========================================================
spring.datasource.url=jdbc:h2:mem:misydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 -> http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================================
# Nombre de la aplicacion (visible en logs)
# ==========================================================
spring.application.name=mayte_api
