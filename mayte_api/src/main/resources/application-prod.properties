# ==========================================================
# Perfil de PRODUCCION (Actividad 9 - persistencia en la nube)
# Se activa poniendo la variable de entorno SPRING_PROFILES_ACTIVE=prod
# en Railway/Render. En local (sin esa variable) se sigue usando H2.
#
# Railway crea automaticamente estas variables al agregar un servicio
# PostgreSQL y enlazarlo a este servicio: PGHOST, PGPORT, PGDATABASE,
# PGUSER, PGPASSWORD. No hay que escribirlas a mano, solo referenciarlas.
# ==========================================================

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# La consola H2 no aplica en produccion
spring.h2.console.enabled=false
